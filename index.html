<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programming Vocabulary Reference</title>
    <link rel="icon" type="image/png" href="fav.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="data.js" defer></script>
    <script src="grade-1-curriculum.js" defer></script>
    <script src="grade-2-curriculum.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell vocab-app">
      <header class="app-header">
        <nav class="top-nav" aria-label="Top-level areas">
          <button class="top-nav__button" type="button" data-area="learning" aria-pressed="true">
            <i data-lucide="graduation-cap" aria-hidden="true"></i>
            <span>Learning Modules</span>
          </button>
          <button class="top-nav__button" type="button" data-area="vocabulary" aria-pressed="false">
            <i data-lucide="book-marked" aria-hidden="true"></i>
            <span>Programming Vocabulary</span>
          </button>
        </nav>
        <nav id="vocabularyBreadcrumbs" class="vocabulary-breadcrumbs" aria-label="Vocabulary breadcrumb"></nav>
        <div class="app-title-block">
          <h1 id="appTitle">Learning Modules</h1>
          <p id="appSubtitle">Choose a grade and expand each section when you are ready to read it.</p>
        </div>
      </header>

      <section id="vocabularySearch" class="search-panel card hidden" aria-label="Vocabulary search">
        <div class="search-field">
          <label class="visually-hidden" for="searchInput">Search terms</label>
          <i data-lucide="search" class="search-field__icon" aria-hidden="true"></i>
          <input id="searchInput" class="field__input search-field__input" type="search" placeholder="Start typing a term" autocomplete="off">
          <button id="clearSearch" class="button button--icon" type="button" title="Clear search" aria-label="Clear search">
            <i data-lucide="x" class="button__icon" aria-hidden="true"></i>
          </button>
        </div>
      </section>

      <section id="vocabularyArea" class="content-grid hidden" aria-label="Vocabulary results and details">
        <aside class="results-panel card" aria-label="Filtered terms">
          <div class="panel-heading">
            <div class="panel-heading__title">
              <h2>Entries</h2>
              <span id="resultCount" class="numeric">0 results</span>
            </div>
            <div class="panel-heading__actions">
              <div class="group-filter" aria-label="Filter article categories">
                <button class="group-filter__button" type="button" data-category="general" aria-label="General programming vocabulary" aria-pressed="true">
                  <i data-lucide="book-marked" aria-hidden="true"></i>
                  <span class="group-filter__tooltip">General programming vocabulary</span>
                </button>
                <button class="group-filter__button" type="button" data-category="confused" aria-label="Commonly confused terms and syntax" aria-pressed="true">
                  <i data-lucide="notebook-tabs" aria-hidden="true"></i>
                  <span class="group-filter__tooltip">Commonly confused terms and syntax</span>
                </button>
                <button class="group-filter__button" type="button" data-category="javascript" aria-label="JavaScript" aria-pressed="true">
                  <i data-lucide="braces" aria-hidden="true"></i>
                  <span class="group-filter__tooltip">JavaScript</span>
                </button>
                <button class="group-filter__button" type="button" data-category="html" aria-label="HTML" aria-pressed="true">
                  <i data-lucide="code-xml" aria-hidden="true"></i>
                  <span class="group-filter__tooltip">HTML</span>
                </button>
                <button class="group-filter__button" type="button" data-category="css" aria-label="CSS" aria-pressed="true">
                  <i data-lucide="hash" aria-hidden="true"></i>
                  <span class="group-filter__tooltip">CSS</span>
                </button>
              </div>
            </div>
          </div>
          <div class="results-scroll">
            <div id="resultsList" class="results-list" role="listbox" aria-label="Search results"></div>
            <div id="emptyState" class="empty-state hidden">
              <i data-lucide="file-question" aria-hidden="true"></i>
              <p class="empty-state__title">Zero results</p>
              <p class="empty-state__message">Try a broader word or clear the search field.</p>
            </div>
          </div>
        </aside>

        <article class="detail-panel card" aria-live="polite">
          <div id="detailEmpty" class="detail-empty hidden"></div>
          <div id="detailContent" class="hidden"></div>
        </article>
      </section>

      <section id="learningArea" class="content-grid" aria-label="Learning modules">
        <aside class="results-panel card" aria-label="Grades">
          <div class="panel-heading">
            <div class="panel-heading__title">
              <h2>Grades</h2>
              <span class="numeric">10 planned</span>
            </div>
          </div>
          <div class="results-scroll">
            <div id="gradeList" class="results-list" role="listbox" aria-label="Grade selection"></div>
          </div>
        </aside>

        <article id="gradeContent" class="detail-panel card" aria-live="polite"></article>
      </section>
    </main>
  </body>
</html>
